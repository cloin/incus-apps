---
- name: Apply one Incus application
  hosts: incus_api
  gather_facts: false

  pre_tasks:
    - name: Validate requested application name
      ansible.builtin.assert:
        that:
          - app is defined
          - app is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: Supply an application with -e app=<name>.

    - name: Load application secrets from OpenBao
      ansible.builtin.include_tasks: tasks/load_openbao_secrets.yml

    - name: Load and validate the application catalog
      ansible.builtin.include_tasks: tasks/load_catalog.yml

    - name: Load application definition
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../apps/{{ app }}.yaml"
        name: _requested_application_file

  tasks:
    - name: Reconcile the shared ingress foundation first
      ansible.builtin.include_tasks: tasks/apply_file.yml
      vars:
        _application_path: "{{ playbook_dir }}/../apps/ingress.yaml"
      when: app != 'ingress'

    - name: Reconcile requested application
      ansible.builtin.include_role:
        name: application
      vars:
        incus_application_definition: "{{ _requested_application_file }}"

- name: Reconcile the requested OpenBao service installation
  ansible.builtin.import_playbook: provision_openbao.yml
  when: app == 'openbao'

- name: Reconcile Caddy after the requested application
  ansible.builtin.import_playbook: reconcile_ingress.yml
