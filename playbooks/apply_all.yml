---
- name: Apply every Incus application
  hosts: incus_api
  gather_facts: false

  pre_tasks:
    - name: Load application secrets from OpenBao
      ansible.builtin.include_tasks: tasks/load_openbao_secrets.yml

  tasks:
    - name: Reconcile the application catalog
      ansible.builtin.include_role:
        name: cloin.incus_compose.catalog
      vars:
        incus_compose_catalog_directory: "{{ playbook_dir }}/../apps"
        incus_compose_resolve_routes: false

- name: Reconcile Caddy after all applications
  ansible.builtin.import_playbook: reconcile_ingress.yml
