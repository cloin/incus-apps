---
- name: Inspect {{ _generated_secret_spec.path }}
  ansible.builtin.uri:
    url: >-
      {{ _generated_api_url }}/v1/{{ openbao_kv_mount
      }}/data/{{ _generated_secret_spec.path }}
    headers:
      X-Vault-Token: "{{ _generated_read_token }}"
    status_code: [200, 404]
  delegate_to: "{{ _generated_api_delegate }}"
  register: _generated_existing_group
  no_log: true

- name: Require operator input for incomplete {{ _generated_secret_spec.path }}
  ansible.builtin.assert:
    that:
      - >-
        _generated_existing_group.status == 200 or
        (_generated_secret_spec.optional and
         _generated_secret_spec.generate | length == 0) or
        (_generated_secret_spec.required | difference(
           _generated_secret_spec.generate.keys() | list) | length == 0 and
         _generated_secret_spec.generate | length > 0)
    fail_msg: >-
      OpenBao group {{ _generated_secret_spec.path }} needs an operator-supplied
      value. Populate it before applying the catalog.

- name: Create missing generated {{ _generated_secret_spec.path }}
  when:
    - _generated_existing_group.status == 404
    - _generated_secret_spec.generate | length > 0
  block:
    - name: Require an application-owned generated secret path
      ansible.builtin.assert:
        that:
          - >-
            _generated_secret_spec.path |
            incus_app_generated_secret_path(_generated_secret_spec.application)
        fail_msg: >-
          Generated secret group {{ _generated_secret_spec.path }} must be under
          its declaring application's incus-apps/apps/ path.

    - name: Require the scoped generator identity in Semaphore
      ansible.builtin.assert:
        that:
          - _generated_writer_secret_id | length > 0
      when: _generated_role_secret_id | length > 0
      no_log: true

    - name: Log in with the scoped generator identity
      ansible.builtin.uri:
        url: "{{ _generated_api_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: >-
            {{ lookup('ansible.builtin.env', 'OPENBAO_GENERATOR_ROLE_ID') |
               default(openbao_generator_role_id, true) }}
          secret_id: "{{ _generated_writer_secret_id }}"
        status_code: 200
      delegate_to: "{{ _generated_api_delegate }}"
      register: _generated_writer_login
      when: _generated_role_secret_id | length > 0
      no_log: true

    - name: Build missing generated values in memory
      ansible.builtin.set_fact:
        _generated_new_values: >-
          {{ _generated_new_values | default({}) | combine({
            item.key: lookup('community.general.random_string',
                             length=item.value.length | default(48),
                             special=false)
          }) }}
      loop: "{{ _generated_secret_spec.generate | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Create absent OpenBao group once
      ansible.builtin.uri:
        url: >-
          {{ _generated_api_url }}/v1/{{ openbao_kv_mount
          }}/data/{{ _generated_secret_spec.path }}
        method: POST
        headers:
          X-Vault-Token: >-
            {{ _generated_writer_login.json.auth.client_token
               if _generated_role_secret_id | length > 0
               else _generated_read_token }}
        body_format: json
        body:
          options:
            cas: 0
          data: "{{ _generated_new_values }}"
        status_code: [200, 400]
      delegate_to: "{{ _generated_api_delegate }}"
      register: _generated_create_result
      no_log: true

    - name: Re-read generated OpenBao group
      ansible.builtin.uri:
        url: >-
          {{ _generated_api_url }}/v1/{{ openbao_kv_mount
          }}/data/{{ _generated_secret_spec.path }}
        headers:
          X-Vault-Token: "{{ _generated_read_token }}"
        status_code: 200
      delegate_to: "{{ _generated_api_delegate }}"
      register: _generated_created_group
      no_log: true

    - name: Require the generated group to be complete
      ansible.builtin.assert:
        that:
          - item in _generated_created_group.json.data.data
          - _generated_created_group.json.data.data[item] | string | length > 0
        fail_msg: >-
          OpenBao group {{ _generated_secret_spec.path }} is missing {{ item }}.
      loop: "{{ _generated_secret_spec.required }}"
      loop_control:
        label: "{{ item }}"

    - name: Revoke scoped generator token
      ansible.builtin.uri:
        url: "{{ _generated_api_url }}/v1/auth/token/revoke-self"
        method: POST
        headers:
          X-Vault-Token: "{{ _generated_writer_login.json.auth.client_token }}"
        status_code: 204
      delegate_to: "{{ _generated_api_delegate }}"
      when: _generated_role_secret_id | length > 0
      no_log: true

    - name: Clear generated values from task facts
      ansible.builtin.set_fact:
        _generated_new_values: {}
      no_log: true
