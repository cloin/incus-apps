---
- name: Read application secret declarations
  incus_apps_catalog_metadata:
    directory: "{{ playbook_dir }}/../apps"
  delegate_to: localhost
  register: _generated_catalog_metadata

- name: Validate application secret declarations
  ansible.builtin.set_fact:
    _generated_secret_specs: >-
      {{ _generated_catalog_metadata.catalog_metadata | incus_app_secret_specs }}

- name: Select OpenBao preparation authentication
  ansible.builtin.set_fact:
    _generated_role_secret_id: "{{ lookup('ansible.builtin.env', 'OPENBAO_SECRET_ID') }}"
    _generated_writer_secret_id: "{{ lookup('ansible.builtin.env', 'OPENBAO_GENERATOR_SECRET_ID') }}"
    _generated_api_url: >-
      {{ lookup('ansible.builtin.env', 'OPENBAO_ADDR') | default(openbao_public_url, true)
         if lookup('ansible.builtin.env', 'OPENBAO_SECRET_ID') | length > 0
         else 'http://127.0.0.1:8200' }}
    _generated_api_delegate: >-
      {{ 'localhost' if lookup('ansible.builtin.env', 'OPENBAO_SECRET_ID') | length > 0
         else 'openbao' }}
  no_log: true

- name: Load local OpenBao operator identity
  ansible.builtin.include_vars:
    file: "{{ openbao_recovery_vault_path }}"
    name: _generated_recovery
  when:
    - _generated_role_secret_id | length == 0
    - _generated_secret_specs | length > 0
  no_log: true

- name: Log in to OpenBao for catalog inspection
  ansible.builtin.uri:
    url: "{{ _generated_api_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ lookup('ansible.builtin.env', 'OPENBAO_ROLE_ID') | default(openbao_semaphore_role_id, true) }}"
      secret_id: "{{ _generated_role_secret_id }}"
    status_code: 200
  delegate_to: "{{ _generated_api_delegate }}"
  register: _generated_read_login
  when:
    - _generated_role_secret_id | length > 0
    - _generated_secret_specs | length > 0
  no_log: true

- name: Log in as the local OpenBao operator for preparation
  ansible.builtin.uri:
    url: >-
      {{ _generated_api_url }}/v1/auth/userpass/login/{{ openbao_operator_username }}
    method: POST
    body_format: json
    body:
      password: "{{ _generated_recovery.openbao_operator_password }}"
    status_code: 200
  delegate_to: openbao
  register: _generated_operator_login
  when:
    - _generated_role_secret_id | length == 0
    - _generated_secret_specs | length > 0
  no_log: true

- name: Select preparation read token
  ansible.builtin.set_fact:
    _generated_read_token: >-
      {{ _generated_read_login.json.auth.client_token
         if _generated_role_secret_id | length > 0
         else _generated_operator_login.json.auth.client_token }}
  when: _generated_secret_specs | length > 0
  no_log: true

- name: Prepare each declared secret group
  ansible.builtin.include_tasks: prepare_generated_secret_group.yml
  loop: "{{ _generated_secret_specs }}"
  loop_control:
    loop_var: _generated_secret_spec
    label: "{{ _generated_secret_spec.path }}"

- name: Revoke preparation read token
  ansible.builtin.uri:
    url: "{{ _generated_api_url }}/v1/auth/token/revoke-self"
    method: POST
    headers:
      X-Vault-Token: "{{ _generated_read_token }}"
    status_code: 204
  delegate_to: "{{ _generated_api_delegate }}"
  when: _generated_secret_specs | length > 0
  no_log: true
