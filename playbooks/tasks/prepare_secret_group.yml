---
- name: Read {{ _prepared_secret_spec.path }}
  ansible.builtin.uri:
    url: >-
      {{ _openbao_management_url }}/v1/{{ openbao_kv_mount
      }}/data/{{ _prepared_secret_spec.path }}
    headers:
      X-Vault-Token: "{{ _openbao_prepare_login.json.auth.client_token }}"
    status_code: [200, 404]
  delegate_to: openbao
  register: _prepared_secret_group
  no_log: true

- name: Initialize {{ _prepared_secret_spec.path }} values
  ansible.builtin.set_fact:
    _prepared_existing_values: >-
      {{ _prepared_secret_group.json.data.data
         if _prepared_secret_group.status == 200 else {} }}
    _prepared_generated_values: {}
  no_log: true

- name: Generate absent values for {{ _prepared_secret_spec.path }}
  ansible.builtin.set_fact:
    _prepared_generated_values: >-
      {{ _prepared_generated_values | combine({
        item.key: lookup(
          'community.general.random_string',
          length=item.value.length | default(48),
          special=false
        )
      }) }}
  loop: "{{ _prepared_secret_spec.generate | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key not in _prepared_existing_values
  no_log: true

- name: Select complete values for {{ _prepared_secret_spec.path }}
  ansible.builtin.set_fact:
    _prepared_complete_values: >-
      {{ _prepared_existing_values | combine(_prepared_generated_values) }}
  no_log: true

- name: Require every declared value for {{ _prepared_secret_spec.path }}
  ansible.builtin.assert:
    that:
      - item in _prepared_complete_values
      - _prepared_complete_values[item] | string | length > 0
    fail_msg: >-
      {{ _prepared_secret_spec.path }} requires {{ item }}, but the definition
      has no generator for it. Add the value through the OpenBao UI and rerun.
  loop: "{{ _prepared_secret_spec.required }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Store generated values for {{ _prepared_secret_spec.path }}
  ansible.builtin.uri:
    url: >-
      {{ _openbao_management_url }}/v1/{{ openbao_kv_mount
      }}/data/{{ _prepared_secret_spec.path }}
    method: POST
    headers:
      X-Vault-Token: "{{ _openbao_prepare_login.json.auth.client_token }}"
    body_format: json
    body:
      options:
        cas: >-
          {{ _prepared_secret_group.json.data.metadata.version
             if _prepared_secret_group.status == 200 else 0 }}
      data: "{{ _prepared_complete_values }}"
    status_code: 200
  delegate_to: openbao
  when: _prepared_generated_values | length > 0
  no_log: true
