---
- name: Read application secret metadata without rendering service templates
  incus_apps_catalog_metadata:
    directory: "{{ playbook_dir }}/../apps"
  delegate_to: localhost
  register: _openbao_catalog_metadata

- name: Select the OpenBao runtime authentication path
  ansible.builtin.set_fact:
    _openbao_runtime_url: >-
      {{ lookup('ansible.builtin.env', 'OPENBAO_ADDR') |
         default(openbao_public_url, true) }}
    _openbao_supplied_token: >-
      {{ lookup('ansible.builtin.env', 'OPENBAO_TOKEN') |
         default(lookup('ansible.builtin.env', 'BAO_TOKEN'), true) |
         default(lookup('ansible.builtin.env', 'VAULT_TOKEN'), true) }}
    _openbao_runtime_role_id: >-
      {{ lookup('ansible.builtin.env', 'OPENBAO_ROLE_ID') |
         default(openbao_semaphore_role_id, true) }}
    _openbao_runtime_secret_id: >-
      {{ lookup('ansible.builtin.env', 'OPENBAO_SECRET_ID') }}
  no_log: true

- name: Select the OpenBao API route
  ansible.builtin.set_fact:
    _openbao_runtime_api_url: >-
      {{ _openbao_runtime_url
         if _openbao_runtime_secret_id | length > 0
         else 'http://127.0.0.1:8200' }}
    _openbao_runtime_delegate: >-
      {{ 'localhost'
         if _openbao_runtime_secret_id | length > 0
         else 'openbao' }}
    _openbao_runtime_secret_specs: >-
      {{ (_openbao_catalog_metadata.catalog_metadata
          if openbao_secret_applications is not defined
          else (_openbao_catalog_metadata.catalog_metadata |
                selectattr('name', 'in', openbao_secret_applications) | list)) |
         incus_app_secret_specs }}
  no_log: true

- name: Load the encrypted local OpenBao recovery identity
  ansible.builtin.include_vars:
    file: "{{ openbao_recovery_vault_path }}"
    name: _openbao_recovery
  no_log: true
  when:
    - _openbao_supplied_token | length == 0
    - _openbao_runtime_secret_id | length == 0

- name: Log in to OpenBao with the Semaphore AppRole
  ansible.builtin.uri:
    url: "{{ _openbao_runtime_api_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ _openbao_runtime_role_id }}"
      secret_id: "{{ _openbao_runtime_secret_id }}"
    status_code: 200
    validate_certs: true
  delegate_to: "{{ _openbao_runtime_delegate }}"
  register: _openbao_runtime_approle_login
  no_log: true
  when:
    - _openbao_supplied_token | length == 0
    - _openbao_runtime_secret_id | length > 0

- name: Log in to OpenBao with the local recovery operator
  ansible.builtin.uri:
    url: >-
      {{ _openbao_runtime_api_url }}/v1/auth/userpass/login/{{ openbao_operator_username }}
    method: POST
    body_format: json
    body:
      password: "{{ _openbao_recovery.openbao_operator_password }}"
    status_code: 200
  delegate_to: "{{ _openbao_runtime_delegate }}"
  register: _openbao_runtime_operator_login
  no_log: true
  when:
    - _openbao_supplied_token | length == 0
    - _openbao_runtime_secret_id | length == 0

- name: Select the short-lived OpenBao read token
  ansible.builtin.set_fact:
    _openbao_runtime_token: >-
      {{ _openbao_supplied_token
         if _openbao_supplied_token | length > 0
         else (_openbao_runtime_approle_login.json.auth.client_token
               if _openbao_runtime_secret_id | length > 0
               else _openbao_runtime_operator_login.json.auth.client_token) }}
    _openbao_runtime_revoke_token: "{{ _openbao_supplied_token | length == 0 }}"
  no_log: true

- name: Read declared application secret groups from OpenBao
  ansible.builtin.uri:
    url: >-
      {{ _openbao_runtime_api_url }}/v1/{{ openbao_kv_mount }}/data/{{ item.path }}
    headers:
      X-Vault-Token: "{{ _openbao_runtime_token }}"
    status_code: [200, 404]
    validate_certs: true
  delegate_to: "{{ _openbao_runtime_delegate }}"
  register: _openbao_runtime_secret_groups
  loop: "{{ _openbao_runtime_secret_specs }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Require every non-optional OpenBao secret group
  ansible.builtin.assert:
    that:
      - item.status == 200 or item.item.optional | bool
    fail_msg: >-
      OpenBao has no secret group {{ item.item.path }}. Create its required
      values before applying this application.
  loop: "{{ _openbao_runtime_secret_groups.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  no_log: true

- name: Initialize the runtime application secret set
  ansible.builtin.set_fact:
    _openbao_runtime_secrets: {}
  no_log: true

- name: Combine available OpenBao application secret groups
  ansible.builtin.set_fact:
    _openbao_runtime_secrets: >-
      {{ _openbao_runtime_secrets | combine(item.json.data.data) }}
  loop: "{{ _openbao_runtime_secret_groups.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.status == 200
  no_log: true

- name: Require each application-declared OpenBao value
  ansible.builtin.assert:
    that:
      - item.1 in _openbao_runtime_secrets
      - _openbao_runtime_secrets[item.1] | string | length > 0
    fail_msg: >-
      OpenBao group {{ item.0.path }} does not contain required value {{ item.1 }}.
  loop: >-
    {{ query('ansible.builtin.subelements',
             _openbao_runtime_secret_specs, 'required', {'skip_missing': true}) }}
  loop_control:
    label: "{{ item.0.path }}:{{ item.1 }}"
  no_log: true

- name: Publish OpenBao values as in-memory Ansible variables
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _openbao_runtime_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Revoke the short-lived OpenBao token
  ansible.builtin.uri:
    url: "{{ _openbao_runtime_api_url }}/v1/auth/token/revoke-self"
    method: POST
    headers:
      X-Vault-Token: "{{ _openbao_runtime_token }}"
    status_code: 204
    validate_certs: true
  delegate_to: "{{ _openbao_runtime_delegate }}"
  when: _openbao_runtime_revoke_token | bool
  no_log: true
