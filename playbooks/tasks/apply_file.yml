---
- name: Load application definition from {{ _application_path | basename }}
  ansible.builtin.include_vars:
    file: "{{ _application_path }}"
    name: _application_file

- name: Reconcile {{ _application_file.name }}
  ansible.builtin.include_role:
    name: cloin.incus_compose.application
  vars:
    incus_compose_application: "{{ _application_file }}"
    incus_compose_update: "{{ _application_update | default(false) }}"
