---
- name: Ensure volume {{ _incus_volume_item.key }} exists
  damex.incus.incus_storage_volume:
    name: "{{ _incus_volume_item.value.name | default(_incus_volume_item.key) }}"
    description: >-
      {{ _incus_volume_item.value.description |
         default('Managed by incus-apps: ' ~ _incus_app_name ~ '/' ~ _incus_volume_item.key) }}
    pool: >-
      {{ _incus_volume_item.value.pool |
         default(_incus_app_defaults.storage_pool | default(incus_default_storage_pool)) }}
    project: "{{ _incus_app_project }}"
    target: "{{ _incus_volume_item.value.target | default(omit) }}"
    content_type: "{{ _incus_volume_item.value.content_type | default('filesystem') }}"
    config: >-
      {{ (_incus_volume_item.value.config | default({})) |
         combine({'size': _incus_volume_item.value.size}
         if _incus_volume_item.value.size is defined else {}) }}
    state: present
    url: "{{ incus_api_url }}"
    client_cert_path: "{{ incus_client_cert_path }}"
    client_key_path: "{{ incus_client_key_path }}"
    server_cert_path: "{{ incus_server_cert_path | default(omit, true) }}"
    validate_certs: "{{ incus_validate_certs }}"
