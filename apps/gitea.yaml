---
schema: cloin.incus-compose/v1
name: gitea
state: present
description: Git service for the Incus applications repository
placement: "{{ incus_app_placement }}"

defaults:
  storage_pool: "{{ incus_default_storage_pool }}"
  network: private
  profiles: []
services:
  gitea:
    name: git
    type: oci
    image: gitea:1.27.1
    source_server: https://docker.gitea.com
    source_protocol: oci
    root:
      size: 8GiB

    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: "{{ gitea_hostname }}"
      GITEA__server__ROOT_URL: "{{ gitea_public_url }}/"
      GITEA__server__SSH_DOMAIN: "{{ gitea_hostname }}"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__ALLOWED_HOST_LIST: >-
        {{ incus_host_address }},{{ semaphore_hostname }}
      GITEA__service__DISABLE_REGISTRATION: "true"

    volumes:
      data: /data

    networks:
      - name: private
      - name: ingress

    routes:
      - host: "{{ gitea_hostname }}"
        port: 3000
        scheme: http

    ports:
      # Ansible uses this managed listener for bootstrap/runtime health checks.
      - name: legacy-http
        protocol: tcp
        listen_port: "{{ gitea_bootstrap_port }}"
        target_port: 3000
      - name: ssh
        protocol: tcp
        listen_port: 2222
        target_port: 22

    healthcheck:
      http: "{{ gitea_bootstrap_url }}/api/healthz"
      status: [200]
      interval: 3
      retries: 60

    config:
      limits.cpu: "2"
      limits.memory: 2GiB

networks:
  private:
    type: bridge
    config:
      ipv4.address: "{{ incus_app_network_prefix }}.1.1/24"
      ipv4.nat: true
      ipv6.address: none
      dns.domain: gitea.internal

  ingress:
    external: true
    name: ingress

volumes:
  data:
    size: 30GiB
    retain: true
    config:
      snapshots.schedule: "@daily"
      snapshots.expiry: 14d

x-incus-apps:
  secrets:
    - path: incus-apps/gitea
      required:
        - lab_gitea_admin_username
        - lab_gitea_admin_password
        - lab_gitea_admin_email
        - lab_gitea_webhook_secret
